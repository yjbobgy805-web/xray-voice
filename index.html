<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다국어 검진 안내 음성(TTS) 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      background-color: #f1f5f9;
    }
    /* Pulse animation for active voice playing */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
    .playing-btn {
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-blue-100">

  <!-- GNB / Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-200">
          <i class="ph-bold ph-first-aid text-2xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">다국어 검진 안내 음성</h1>
          <p class="text-xs text-slate-500 font-medium">Hospital Examination TTS System</p>
        </div>
      </div>
      
      <!-- Home Button (Persistent Navigation) -->
      <button id="btnHome" onclick="navigateTo('home')" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition-all duration-200 active:scale-95 border border-slate-200">
        <i class="ph-bold ph-house text-base"></i>
        <span>홈으로</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6">

    <!-- PAGE 1: Home / Country Selection Grid View -->
    <section id="pageHome" class="space-y-6">
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg shadow-blue-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
          <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md text-xs font-semibold rounded-full mb-2">원터치 검진 안내</span>
          <h2 class="text-xl md:text-2xl font-bold">환자의 국적을 선택해주세요</h2>
          <p class="text-blue-100 text-sm mt-1">해당 국가를 클릭하면 한국어 검진 안내 문구 목록으로 이동합니다.</p>
        </div>
        <div class="px-4 py-2 bg-white/10 backdrop-blur-md rounded-xl text-xs font-medium border border-white/20">
          총 13개 언어 지원
        </div>
      </div>

      <!-- Country Cards Grid -->
      <div id="countryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <!-- Dynamic JS Generation -->
      </div>
    </section>

    <!-- PAGE 2: Audio Phrases Dedicated View -->
    <section id="pagePhrases" class="hidden space-y-6">
      <!-- Country Banner Header -->
      <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-4">
          <span id="selectedFlag" class="text-5xl filter drop-shadow-sm">🇨🇳</span>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="selectedLangKo" class="text-2xl font-bold text-slate-900">중국어</h2>
              <span id="selectedLangNative" class="text-sm px-2.5 py-0.5 bg-slate-100 text-slate-600 rounded-full font-medium">中文</span>
            </div>
            <p class="text-sm text-slate-500 mt-0.5">안내할 한국어 문장의 <span class="text-blue-600 font-semibold">재생 버튼</span>을 누르면 해당 언어로 음성이 출력됩니다.</p>
          </div>
        </div>
        
        <!-- Quick Home Back -->
        <button onclick="navigateTo('home')" class="hidden sm:flex items-center gap-1.5 text-xs text-slate-500 hover:text-blue-600 font-medium transition-colors">
          <i class="ph-bold ph-arrow-left"></i>
          다른 언어 선택
        </button>
      </div>

      <!-- Phrase List Container -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm divide-y divide-slate-100 overflow-hidden" id="phraseList">
        <!-- Dynamic Phrase Items -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 mt-8">
    <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
      <p>© 2026 Medical Examination Multi-language Audio System. All rights reserved.</p>
    </div>
  </footer>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 z-50">
    <i class="ph-bold ph-speaker-high text-blue-400 text-lg"></i>
    <span id="toastMsg">음성을 재생합니다.</span>
  </div>

        ]

      {
        id: 'vietnam', code: 'vi-VN', flag: '🇻🇳', ko: '베트남어', native: 'Tiếng Việt',
        tts: [
          "Hít một hơi thật sâu và nín thở.", "Thở ra.", "Nằm ngửa ra.", "Nằm nghiêng quay mặt vào tường.",
          "Xin vui lòng tháo giày và nằm xuống.", "Cởi áo khoác ngoài ra.", "Hãy cởi quần và quần lót ra rồi mặc áo choàng vào.",
          "Kiểm tra đã xong. Hãy lau sạch gel và mặc áo choàng vào.", "Xin vui lòng chờ ở bên ngoài."
        ]
      },
      {
        id: 'thailand', code: 'th-TH', flag: '🇹🇭', ko: '태국어', native: 'ไทย',
        tts: [
          "สูดหายใจเข้าลึกๆ แล้วกลั้นหายใจไว้ครับ", "ผ่อนลมหายใจออกครับ", "ชี้นอนหงายตรงๆ ครับ", "นอนหันหน้าเข้าหาผนังครับ",
          "กรุณาถอดรองเท้าแล้วนอนลงครับ", "กรุณาถอดเสื้อคลุมออกครับ", "กรุณาถอดกางเกงและกางเกงชั้นในออก แล้วสวมเสื้อคลุมครับ",

        ]

      {

        tts: [
          "សូមដកដង្ហើមចូលឲ្យជ្រៅ ហើយទប់ដង្ហើមไว้।", "សូមដកដង្ហើមចេញ।", "សូមគេងផ្ងារត្រង់।", "សូមគេងបែរមុខទៅជញ្ជាំង।",

        ]
      },
      {

          "ဖိနပ်ချွတ်ပြီး လှဲအိပ်ပါ။", "ဝတ်ရုံကို ချွတ်ပါ။", "ဘောင်းဘီနှင့် အတွင်းခံကို ချွတ်ပြီး ဝတ်ရုံကို ဝတ်ပါ။",

        ]
      },
      {
        id: 'nepal', code: 'ne-NP', flag: '🇳🇵', ko: '네팔어', native: 'नेपाली',
        tts: [
          "लामो सास फेर्नुहोस् र रोक्नुहोस्।", "सास बाहिर छोड्नुहोस्।", "सिधा पल्टिनुहोस्।", "भित्तातर्फ फर्केर पल्टिनुहोस्।",
          "জুत्ता खोलेर पल्टिनुहोस्।", "गाउन खोल्नुहोस्।", "प्यान्ट र भित्री वस्त्र खोलेर गाउन लगाउनुहोस्।",
          "जाँच सकियो। जेल पुछेर गाउन लगाउनुहोस्।", "बाहिर पर्खनुहोस्।"
        ]
      },
      {
        id: 'indonesia', code: 'id-ID', flag: '🇮🇩', ko: '인도네시아어', native: 'Bahasa Indonesia',
        tts: [
          "Tarik napas dalam-dalam dan tahan napas.", "Hembuskan napas.", "Berbaringlah terlentang.", "Berbaringlah menghadap ke dinding.",
          "Lepas sepatu dan silakan berbaring.", "Lepaskan jubah Anda.", "Lepaskan celana dan celana dalam, lalu kenakan gaun pemeriksaan.",
          "Pemeriksaan telah selesai. Bersihkan gel dan kenakan jubah Anda.", "Silakan tunggu di luar."
        ]
      },
      {
        id: 'bengali', code: 'bn-BD', flag: '🇧🇩', ko: '벵골어', native: 'বাংলা',
        tts: [
          "দীর্ঘ শ্বাস নিন এবং আটকে রাখুন।", "শ্বাস ছেড়ে দিন।", "সোজা হয়ে শুয়ে পড়ুন।", "দেয়ালের দিকে মুখ করে শুয়ে পড়ুন।",

          "পরীক্ষা শেষ হয়েছে। জেল মুছে ফেলুন এবং গাউন পরুন।", "বাইরে অপেক্ষা করুন।"
        ]
      },
      {
        id: 'urdu', code: 'ur-PK', flag: '🇵🇰', ko: '우르두어', native: 'اردو',
        tts: [
          "گہرا سانس لیں اور روکیں۔", "سانس باہر نکالیں۔", "سیدھے لیٹ جائیں۔", "دیوار کی طرف منہ کر کے لیٹ جائیں۔",
          "جوتے اتار کر لیٹ جائیں۔", "گاؤن اتاریں۔", "پینٹ اور انڈر ویئر اتار کر گاؤن پہن لیں۔",
          "معائنہ مکمل ہو گیا۔ جیل صاف کریں اور گاؤن پہن لیں۔", "براہ کرم باہر انتظار کریں۔"
        ]
      },
      {
        id: 'uzbek', code: 'uz-UZ', flag: '🇺🇿', ko: '우즈베키스탄어', native: "O'zbekcha",
        tts: [
          "Chuqur nafas oling va ushlab turing.", "Nafas chiqaring.", "Tekis yoting.", "Devorga qarab yoting.",
          "Poyabzalingizni yechib yoting.", "Xalatni yeching.", "Shalvar va ichki kiyimni yechib, xalatni kiying.",

        ]

        tts: [
          "Терең тыныс алып, ұстап тұрыңыз.", "Тыныс шығарыңыз.", "Түзу жатыңыз.", "Қабырғаға қарап жатыңыз.",
          "Аяқ киіміңізді шешіп жатыңыз.", "Халатты шешіңіз.", "Шабар мен іш киімді шешіп, халатты киіңіз.",
          "Тексеру аяқталды. Гельді сүртіп, халатты киіңіз.", "Сыртта күте тұрыңыз."
        ]
      },
      {
        id: 'russian', code: 'ru-RU', flag: '🇷🇺', ko: '러시아어', native: 'Русский',
        tts: [

          "Снимите обувь и лягте.", "Снимите халат.", "Снимите брюки и нижнее белье и надеть халат.",

        ]

    ];

    let currentSelectedLang = null;

    // DOM Elements
    const pageHome = document.getElementById('pageHome');
    const pagePhrases = document.getElementById('pagePhrases');
    const countryGrid = document.getElementById('countryGrid');
    const phraseList = document.getElementById('phraseList');

    // Render Country Cards Grid
    function renderCountryGrid() {
      countryGrid.innerHTML = '';
      languages.forEach((lang) => {
        const card = document.createElement('div');
        card.className = "bg-white hover:bg-blue-50/50 border border-slate-200 hover:border-blue-300 rounded-2xl p-5 flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer group active:scale-95";
        card.innerHTML = `
          <div class="text-4xl md:text-5xl mb-3 group-hover:scale-110 transition-transform duration-200 filter drop-shadow-sm">${lang.flag}</div>
          <div class="font-bold text-slate-800 text-base group-hover:text-blue-600 transition-colors">${lang.ko}</div>
          <div class="text-xs text-slate-400 mt-1 font-medium">${lang.native}</div>
          <div class="mt-3 px-3 py-1 bg-slate-100 group-hover:bg-blue-100 text-slate-600 group-hover:text-blue-700 text-xs font-semibold rounded-full flex items-center gap-1 transition-colors">
            <i class="ph-bold ph-speaker-high"></i>
            <span>선택하기</span>
          </div>
        `;
        card.onclick = () => selectCountry(lang);
        countryGrid.appendChild(card);
      });
    }

    // Select Country -> Open Dedicated Phrase View
    function selectCountry(lang) {
      currentSelectedLang = lang;
      
      // Update Detail Page UI
      document.getElementById('selectedFlag').textContent = lang.flag;
      document.getElementById('selectedLangKo').textContent = lang.ko;
      document.getElementById('selectedLangNative').textContent = lang.native;

      // Render Korean Phrase List
      phraseList.innerHTML = '';
      koreanPhrases.forEach((phraseText, idx) => {
        const item = document.createElement('div');
        item.className = "p-4 sm:p-5 flex items-center justify-between gap-4 hover:bg-slate-50 transition-colors";
        
        item.innerHTML = `
          <div class="flex-1 pr-2">
            <span class="text-base sm:text-lg font-bold text-slate-800 leading-snug">${phraseText}</span>
          </div>
          <button id="btn-play-${idx}" onclick="playAudio('${idx}')" class="flex-shrink-0 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl shadow-md shadow-blue-200 flex items-center gap-2 text-sm transition-all active:scale-95">
            <i class="ph-bold ph-speaker-high text-lg"></i>
            <span>재생</span>
          </button>
        `;
        phraseList.appendChild(item);
      });

      navigateTo('phrases');
    }

    // Page Navigation Router (SPA Style)
    function navigateTo(page) {
      // Cancel active speech if navigating away
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      if (page === 'home') {
        pagePhrases.classList.add('hidden');
        pageHome.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (page === 'phrases') {
        pageHome.classList.add('hidden');
        pagePhrases.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Play TTS Function
    function playAudio(index) {
      if (!currentSelectedLang) return;

      const ttsText = currentSelectedLang.tts[index];
      const koText = koreanPhrases[index];

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop current playing speech

        const utterance = new SpeechSynthesisUtterance(ttsText);
        utterance.lang = currentSelectedLang.code;
        utterance.rate = 0.85; // Slightly slower for medical examination clarity

        const playBtn = document.getElementById(`btn-play-${index}`);
        
        utterance.onstart = () => {
          showToast(`[${currentSelectedLang.ko}] "${koText}" 음성을 재생 중입니다.`);
          if(playBtn) {
            playBtn.classList.add('playing-btn', 'bg-emerald-600');
            playBtn.classList.remove('bg-blue-600');
            playBtn.querySelector('span').textContent = '재생 중...';
          }
        };

        utterance.onend = () => {
          if(playBtn) {
            playBtn.classList.remove('playing-btn', 'bg-emerald-600');
            playBtn.classList.add('bg-blue-600');
            playBtn.querySelector('span').textContent = '재생';
          }
        };

        utterance.onerror = (e) => {
          showToast('음성 재생 중 오류가 발생했습니다.');
          if(playBtn) {
            playBtn.classList.remove('playing-btn', 'bg-emerald-600');
            playBtn.classList.add('bg-blue-600');
            playBtn.querySelector('span').textContent = '재생';
          }
        };

        window.speechSynthesis.speak(utterance);
      } else {
        alert('이 브라우저는 음성 합성(TTS) 기능을 지원하지 않습니다.');
      }
    }

    // Toast Notification helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Initial Load
    window.onload = () => {
      renderCountryGrid();
    };
  </script>
</body>
</html>
